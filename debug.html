<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Shaam-e-Gazal Debug</title>
  <style>
    body { font-family: monospace; background:#111; color:#eee; padding:20px; }
    h2 { color:#c8922a; }
    .ok   { color: #4ade80; }
    .fail { color: #f87171; }
    .wait { color: #facc15; }
    #log  { margin-top:20px; border:1px solid #333; padding:12px; border-radius:8px; }
    #log p { margin:4px 0; font-size:13px; }
    button { margin:8px 4px 0; padding:8px 16px; background:#c8922a; color:#000;
             border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; }
    #ytdiv { position:fixed; bottom:0; left:0; width:200px; height:112px; opacity:0; pointer-events:none; }
  </style>
</head>
<body>
  <h2>🪔 Shaam-e-Gazal — Debug Page</h2>
  <p>Open browser DevTools (F12) → Console for full errors.</p>

  <div id="log"></div>

  <button onclick="testPlay()">▶ Test Play (Hoshwalon Ko Khabar Kya)</button>
  <button onclick="testPlay2()">▶ Test Play (Afreen Afreen)</button>
  <button onclick="stopPlay()">⏹ Stop</button>

  <div id="ytdiv"></div>

  <script>
    var player = null;
    var playerReady = false;
    var log = document.getElementById('log');

    function addLog(msg, type) {
      type = type || 'wait';
      var p = document.createElement('p');
      p.className = type;
      p.textContent = new Date().toLocaleTimeString() + '  ' + msg;
      log.appendChild(p);
      console.log(msg);
    }

    addLog('Step 1: Page loaded. Checking for YT global...', 'wait');
    setTimeout(function() {
      if (typeof YT !== 'undefined') {
        addLog('Step 1: YT global EXISTS: ' + JSON.stringify(Object.keys(YT)), 'ok');
      } else {
        addLog('Step 1 FAIL: YT global NOT defined yet (will check after API loads)', 'wait');
      }
    }, 100);

    window.onYouTubeIframeAPIReady = function() {
      addLog('Step 2: onYouTubeIframeAPIReady fired! Creating player...', 'ok');

      try {
        player = new YT.Player('ytdiv', {
          height: '112',
          width:  '200',
          videoId: 'n_P41YQ3l24',
          playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0 },
          events: {
            onReady: function(e) {
              playerReady = true;
              addLog('Step 3: Player READY. playerReady = true', 'ok');
              addLog('Step 4: Duration available: ' + e.target.getDuration(), 'ok');
              addLog('All systems go! Click Test Play to verify audio.', 'ok');
            },
            onStateChange: function(e) {
              var states = {'-1':'UNSTARTED','0':'ENDED','1':'PLAYING','2':'PAUSED','3':'BUFFERING','5':'CUED'};
              addLog('State changed: ' + (states[e.data] || e.data), e.data === 1 ? 'ok' : 'wait');
            },
            onError: function(e) {
              var errors = {'2':'Invalid video ID','5':'HTML5 error','100':'Video not found','101':'Embedding not allowed','150':'Embedding not allowed'};
              addLog('PLAYER ERROR: ' + (errors[e.data] || 'Code ' + e.data), 'fail');
              if (e.data === 101 || e.data === 150) {
                addLog('This video does not allow embedding. Need to replace video ID.', 'fail');
              }
            }
          }
        });
        addLog('Step 2: new YT.Player() called successfully', 'ok');
      } catch(err) {
        addLog('Step 2 FAIL: ' + err.message, 'fail');
      }
    };

    function testPlay() {
      if (!playerReady) { addLog('Player not ready yet — wait a moment', 'fail'); return; }
      addLog('Calling player.playVideo()...', 'wait');
      player.loadVideoById('n_P41YQ3l24');
    }
    function testPlay2() {
      if (!playerReady) { addLog('Player not ready yet — wait a moment', 'fail'); return; }
      addLog('Loading Afreen Afreen...', 'wait');
      player.loadVideoById('g2bHwa2qc9E');
    }
    function stopPlay() {
      if (player && playerReady) player.stopVideo();
    }
  </script>

  <!-- YouTube API loads AFTER the callback is defined above -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
