<!DOCTYPE html>
<html lang="hi-IN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shaam-e-Gazal - Ghazals That Turn the Night Into a Mehfil</title>
  <meta name="description" content="Shaam-e-Gazal - An intimate evening of ghazals by Jagjit Singh, Pankaj Udhas, Begum Akhtar, Nusrat Fateh Ali Khan and more. Free, no login, pure nostalgia." />
  <meta name="keywords" content="ghazal, hindi ghazal, jagjit singh, pankaj udhas, begum akhtar, nusrat fateh ali khan, hariharan, talat aziz, chitra singh, shaam e gazal, mehfil" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Shaam-e-Gazal - Ghazals That Turn the Night Into a Mehfil" />
  <meta property="og:description" content="An intimate evening of ghazals by Jagjit Singh, Pankaj Udhas, Begum Akhtar, Nusrat Fateh Ali Khan and more." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Noto+Serif+Devanagari:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hero-bg" id="heroBg"></div>
  <svg class="grain-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true">
    <filter id="film-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="discrete" tableValues="0.1 0.3 0.5 0.7 0.9"/>
        <feFuncG type="discrete" tableValues="0.1 0.3 0.5 0.7 0.9"/>
        <feFuncB type="discrete" tableValues="0.1 0.3 0.5 0.7 0.9"/>
      </feComponentTransfer>
    </filter>
    <rect width="100%" height="100%" filter="url(#film-grain)"/>
  </svg>
  <div class="vignette" aria-hidden="true"></div>
  <canvas id="diyas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="header-left animate-rise">
      <div class="logo-icon" aria-hidden="true">🪔</div>
      <div class="logo-text">
        <span class="logo-title">शाम-ए-ग़ज़ल</span>
        <span class="logo-sub">mehfil · har raat</span>
      </div>
    </div>
    <div class="header-right animate-rise" style="animation-delay:100ms">
      <a href="https://music.youtube.com/search?q=gazal+hindi+songs" target="_blank" rel="noopener noreferrer" class="pill-btn" aria-label="Open on YouTube Music">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
        <span class="pill-label">YT Music</span>
      </a>
    </div>
  </header>

  <main class="hero-section" id="main">
    <div class="hero-content">
      <p class="track-badge animate-rise" style="animation-delay:160ms" id="trackBadge">30 ग़ज़लें · non-stop</p>
      <h1 class="hero-title animate-rise" style="animation-delay:260ms">शाम-ए-ग़ज़ल</h1>
      <div class="hero-divider animate-rise" style="animation-delay:360ms" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-text">ग़ज़लें जो रात को महफ़िल बना दें</span>
        <span class="divider-line"></span>
      </div>
      <p class="hero-sub animate-rise" style="animation-delay:440ms">The Evening Ghazal Mehfil</p>
    </div>
  </main>

  <div class="tracklist-panel" id="tracklistPanel" aria-hidden="true">
    <div class="tracklist-inner">
      <div class="tracklist-header">
        <p class="tracklist-title">ग़ज़लें</p>
        <p class="tracklist-count" id="tracklistCount">30 tracks</p>
      </div>
      <ul class="tracklist" id="tracklist" role="listbox" aria-label="Ghazal playlist"></ul>
    </div>
  </div>

  <div class="player-wrap">
    <div class="player-card" id="playerCard">
      <div class="vinyl-wrap" id="vinylWrap">
        <div class="vinyl" id="vinyl">
          <img id="albumArt" src="" alt="Album art" class="vinyl-art" />
          <div class="vinyl-hole" aria-hidden="true"></div>
        </div>
      </div>
      <div class="track-info">
        <p class="track-name" id="trackName">Loading…</p>
        <p class="track-artist" id="trackArtist">—</p>
        <div class="seek-wrap">
          <div class="seek-bar" id="seekBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="seek-track">
              <div class="seek-fill" id="seekFill" style="width:0%"></div>
            </div>
            <div class="seek-thumb" id="seekThumb" style="left:0%"></div>
          </div>
          <div class="seek-times">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="prevBtn" class="ctrl-btn sm" aria-label="Previous ghazal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="playBtn" class="ctrl-btn lg" aria-label="Play" aria-pressed="false">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
        </button>
        <button id="nextBtn" class="ctrl-btn sm" aria-label="Next ghazal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
        </button>
        <button id="listBtn" class="ctrl-btn sm list-btn" aria-label="Toggle tracklist" aria-expanded="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!--
    ytPlayer: must NOT be display:none (YouTube won't mount).
    Use a real size hidden off-screen. 200x112 = standard 16:9 minimum.
  -->
  <div
    id="ytPlayer"
    style="position:fixed;top:-9999px;left:-9999px;width:200px;height:112px;pointer-events:none;"
    aria-hidden="true"
  ></div>

  <!-- Creator credit -->
  <footer class="creator-footer" aria-label="Creator credit">
    <span>crafted with 🪔 by</span>
    <a href="https://github.com/shivam-giri" target="_blank" rel="noopener noreferrer" class="creator-name">Shivam Giri</a>
  </footer>
  <!-- Load app.js first so onYouTubeIframeAPIReady is defined BEFORE YouTube API fires -->
  <script src="app.js"></script>
  <!-- YouTube API loads last — callback already defined above -->
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
